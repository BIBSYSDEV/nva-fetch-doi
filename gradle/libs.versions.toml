[versions]
rdf4jVersion = { strictly = "5.3.2" }
any23core = { strictly = "2.7" }
j2html = { strictly = "1.6.0" }
# Any23 2.7 declares tika-core 2.3.0 but only uses stable APIs (TikaConfig, Tika.detect, MimeTypes,
# TextStatistics, CharsetDetector), which are unchanged in Tika 3.x. Must be >= 3.2.2 for
# CVE-2025-66516 (XXE in tika-core). Remove together with Any23 in NP-51331.
tika = { strictly = "3.3.2" }

[libraries]
rdf4j-sail-api = { group = "org.eclipse.rdf4j", name = "rdf4j-sail-api", version.ref = "rdf4jVersion" }
rdf4j-model = { group = "org.eclipse.rdf4j", name = "rdf4j-model", version.ref = "rdf4jVersion" }
rdf4j-model-api = { group = "org.eclipse.rdf4j", name = "rdf4j-model-api", version.ref = "rdf4jVersion" }
rdf4j-model-vocabulary = { group = "org.eclipse.rdf4j", name = "rdf4j-model-vocabulary", version.ref = "rdf4jVersion" }
rdf4j-repository-sail = { group = "org.eclipse.rdf4j", name = "rdf4j-repository-sail", version.ref = "rdf4jVersion" }
rdf4j-sail-memory = { group = "org.eclipse.rdf4j", name = "rdf4j-sail-memory", version.ref = "rdf4jVersion" }
rdf4j-repository-api = { group = "org.eclipse.rdf4j", name = "rdf4j-repository-api", version.ref = "rdf4jVersion" }
rdf4j-rio-api = { group = "org.eclipse.rdf4j", name = "rdf4j-rio-api", version.ref = "rdf4jVersion" }

# TODO NP-51331: Any23 is retired (Apache Attic, 2.7 is the final release), replace with a maintained alternative
apache-any23-core = { group = "org.apache.any23", name = "apache-any23-core", version.ref = "any23core" }
apache-any23-api = { group = "org.apache.any23", name = "apache-any23-api", version.ref = "any23core" }

j2html = { group = "com.j2html", name = "j2html", version.ref = "j2html" }

# Declared explicitly so the strict version overrides the tika-core 2.3.0 Any23 pulls in transitively
tika-core = { group = "org.apache.tika", name = "tika-core", version.ref = "tika" }
# Minimal replacement for the excluded tika-parsers-standard-package fat jar (CVE-2025-54988)
tika-parser-text-module = { group = "org.apache.tika", name = "tika-parser-text-module", version.ref = "tika" }

[bundles]
